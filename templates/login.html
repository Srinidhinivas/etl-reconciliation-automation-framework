<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f4f6f9;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .container {

            background: white;

            padding: 30px;

            width: 350px;

            border-radius: 10px;

            box-shadow: 0px 0px 10px rgba(0,0,0,.2);
        }

        h2 {
            text-align: center;
        }

        input {

            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        button {

            width: 100%;
            padding: 10px;

            border: none;

            background: #1f4e79;
            color: white;

            cursor: pointer;
        }

        .error {

            color: red;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>ETL Portal Login</h2>

    {% if error_message %}

    <p class="error">
        {{ error_message }}
    </p>

    {% endif %}

    <form
        action="/login"
        method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>

</html>
