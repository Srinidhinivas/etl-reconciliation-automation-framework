<!DOCTYPE html>
<html>

<head>

    <title>ETL Reconciliation Portal</title>
    

    <style>

        body {

            font-family: Arial, sans-serif;
            background-color: #f4f6f9;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            margin: 0;
        }

        .container {

            background: white;

            width: 500px;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0px 0px 10px
            rgba(0,0,0,0.2);
        }

        h1 {

            text-align: center;
            color: #1f4e79;
        }

        label {

            font-weight: bold;
        }

        input[type="file"] {

            width: 100%;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        button {

            background-color: #1f4e79;
            color: white;

            border: none;

            padding: 12px 20px;

            width: 100%;

            cursor: pointer;

            border-radius: 5px;

            font-size: 16px;
        }

        button:hover {

            background-color: #2d6ca2;
        }

        .footer {

            text-align: center;
            margin-top: 20px;
            color: gray;
            font-size: 12px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>
            ETL Reconciliation Portal
        </h1>

{% if error_message %}

<p style="
    color:red;
    font-weight:bold;
">

    {{ error_message }}

</p>

{% endif %}


        <form
            action="/compare"
            method="POST"
            enctype="multipart/form-data">

            <label>
                Source File
            </label>

            <input
                type="file"
                name="source_file"
                required>

            <label>
                Target File
            </label>

            <input
                type="file"
                name="target_file"
                required>

            <button type="submit">
                Compare Files
            </button>

        </form>

        <div class="footer">
            ETL Reconciliation Automation Framework
        </div>

    </div>

</body>

</html>
